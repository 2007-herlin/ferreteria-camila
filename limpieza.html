      margin: 0; padding: 0;
      background: #e6f2ff;
      color: #004d99;
    }

    header {
      background: #66b3ff;
      color: white;
      padding: 20px;
      position: relative;
      text-align: center;
      font-weight: 700;
      font-size: 28px;
      user-select: none;
      box-shadow: 0 5px 15px rgba(102,179,255,0.7);
    }

    .btn-volver {
      position: absolute;
      left: 20px;
      top: 20px;
      background: white;
      color: #0073e6;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,115,230,0.5);
      transition: background-color 0.3s ease, color 0.3s ease;
      user-select: none;
    }
    .btn-volver:hover {
      background-color: #cce6ff;
      color: #004d99;
    }
    .btn-volver::before {
      content: "⮜ ";

      text-align: center;
      margin: 30px auto 20px;
      font-weight: 700;
      font-size: 24px;
      color: #003366;
      user-select: none;
    }

    .grid-productos {
      max-width: 1100px;
      margin: 0 auto 40px;
      padding: 0 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 24px;
    }

    .producto {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0, 102, 204, 0.2);
      padding: 16px 12px 18px;
      text-align: center;
      color: #004d99;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }
    .producto:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0, 102, 204, 0.4);
    }

    .producto img {
      width: 100%;
      max-height: 110px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 12px;
      user-select: none;
      filter: drop-shadow(0 2px 5px rgba(0, 77, 153, 0.15));
    }

    .producto h3 {
      font-size: 17px;
      font-weight: 700;
      margin: 8px 0 6px;
      color: #004080;
      user-select: text;
    }

    .producto p {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 12px;
      color: #0066cc;
      user-select: text;
      text-shadow: 0 1px 1px rgba(0, 102, 204, 0.15);
    }

    .controls {
      margin-top: auto;
      display: flex;

      gap: 10px;
      align-items: center;
    }

    .cantidad {

      font-size: 16px;
      text-align: center;
      border-radius: 10px;

      font-weight: 600;

      user-select: text;
    }
    .cantidad:focus {

      border-color: #004d99;
      box-shadow: 0 0 8px #3380ffaa;

      user-select: none;

    }

  <script>
    function agregarAlCarritoDesdeElemento(boton) {
      const productoDiv = boton.closest('.producto');
      const nombre = productoDiv.querySelector('h3').innerText;
      const precioTexto = productoDiv.querySelector('p').innerText.replace('S/', '').trim();
      const precio = parseFloat(precioTexto);
      const cantidad = parseInt(productoDiv.querySelector('input[type="number"]').value);

      if (isNaN(cantidad) || cantidad <= 0) {
        alert("Por favor ingresa una cantidad válida.");
        return;
      }

      let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
      const index = carrito.findIndex(p => p.nombre === nombre);
      if (index !== -1) {
        carrito[index].cantidad += cantidad;
      } else {
        carrito.push({ nombre, precio, cantidad });
      }

      localStorage.setItem('carrito', JSON.stringify(carrito));
      alert(`${cantidad} unidad(es) de "${nombre}" agregadas al carrito.`);
    }

    document.querySelectorAll('.agregar-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        agregarAlCarritoDesdeElemento(this);
      });
    });
  </script>
